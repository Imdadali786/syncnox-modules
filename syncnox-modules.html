<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Syncnox — One platform</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&display=swap');

  body{margin:0;background:#fff}
  #mo{
    --gray-10:#f4f4f4; --gray-20:#e0e0e0; --gray-30:#c6c6c6; --gray-50:#8d8d8d; --gray-70:#525252; --ink:#161616;
    --accent:#015c11; --bright:#00c80d;
    --muted:var(--gray-70); --faint:var(--gray-50);
    --grad:linear-gradient(90deg,#015c11,#00c80d);
    --scr:#FBFCF8; --scr-bar:#F2F4EC;
    --purple:#8a3ffc; --purple-050:#f6f2ff; --blue:#0f62fe;
    --f:"Geist",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --ease:cubic-bezier(.2,0,.38,.9); --ease-soft:cubic-bezier(.16,1,.3,1); --ease-out:cubic-bezier(.22,1,.36,1); --spring:cubic-bezier(.34,1.56,.64,1); --io:cubic-bezier(.65,0,.35,1);
    font-family:var(--f);color:var(--muted);line-height:1.5;-webkit-font-smoothing:antialiased;
    font-feature-settings:"zero" 0,"ss01" 0;font-variant-numeric:lining-nums tabular-nums;
    background:#fff;padding:clamp(64px,8vw,112px) 0;position:relative;
  }
  #mo *,#mo *::before,#mo *::after{box-sizing:border-box;border-radius:0}
  #mo .wrap{max-width:1180px;margin:0 auto;padding:0 clamp(16px,4vw,48px)}
  #mo svg.i{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}

  /* header */
  #mo .sec-head{text-align:center;max-width:820px;margin:0 auto clamp(40px,5vw,60px)}
  #mo .eyebrow{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);display:inline-flex;align-items:center;gap:10px;margin:0 0 18px}
  #mo .eyebrow::before{content:"";width:22px;height:3px;background:var(--grad)}
  #mo h2{font-weight:400;letter-spacing:-.025em;line-height:1.08;font-size:clamp(30px,3.9vw,46px);margin:0;
    background:linear-gradient(100deg,#0A0A0A 0%,#013a0b 46%,#00c80d 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
  #mo h2 .hl{font-weight:600}
  #mo .sec-head p{margin:18px auto 0;font-size:1.06rem;line-height:1.6;max-width:46ch}

  #mo .grid{display:grid;grid-template-columns:minmax(0,.78fr) minmax(0,1.22fr);column-gap:clamp(28px,4.4vw,64px);align-items:center}

  /* module switches: always readable, the switch carries the state */
  #mo .list{display:flex;flex-direction:column}
  #mo .hint{display:flex;align-items:center;justify-content:space-between;margin:0 0 8px;padding:0 12px;font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--faint)}
  #mo .row{position:relative;display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;padding:11px 12px;background:none;border:none;cursor:pointer;font-family:inherit;text-align:left;color:inherit;transition:background .25s}
  #mo .row::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:2px;background:var(--mc);transform:scaleY(0);transition:transform .35s var(--ease-out)}
  #mo .row:hover,#mo .row.hl{background:#fafafa}
  #mo .row.hl::before{transform:scaleY(1)}
  #mo .row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  #mo .row .pi{width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:var(--gray-10);color:var(--muted);transition:background .35s,color .35s}
  #mo .row .pi svg{width:17px;height:17px}
  #mo .row b{display:flex;align-items:center;gap:8px;font-size:1rem;font-weight:600;letter-spacing:-.01em;color:var(--ink);line-height:1.3}
  #mo .row b em{font-style:normal;font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.1em;padding:2px 5px;background:var(--gray-10);color:var(--muted);white-space:nowrap}
  #mo .row b em.api{background:#edf5ff;color:var(--blue)}
  #mo .row small{display:block;margin-top:2px;font-size:.875rem;line-height:1.45;color:var(--muted)}
  #mo .row .sw{position:relative;width:36px;height:20px;background:var(--gray-20);transition:background .3s}
  #mo .row .sw::after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;background:#fff;transition:transform .35s var(--spring)}
  #mo .row.on .pi{background:var(--mc);color:#fff}
  #mo .row.on .sw{background:var(--mc)}
  #mo .row.on .sw::after{transform:translateX(16px)}
  #mo .row.core{cursor:default}

  /* frame + screen */
  #mo .frame{position:relative;background:linear-gradient(150deg,#000 0%,#013a0b 42%,#00c80d 100%);padding:clamp(10px,2.6vw,34px);overflow:hidden}
  #mo .frame::before{content:"";position:absolute;inset:0;background:radial-gradient(540px circle at var(--mx,24%) var(--my,14%),rgba(90,255,120,.42),rgba(0,200,13,.15) 46%,transparent 74%);pointer-events:none}
  #mo .scr{position:relative;z-index:1;background:var(--scr);box-shadow:0 30px 60px rgba(8,16,4,.45)}
  #mo .bar{display:flex;align-items:center;gap:10px;height:46px;padding:0 6px 0 16px;background:var(--scr-bar);font-family:var(--mono);font-size:11.5px;font-weight:600;color:var(--ink)}
  #mo .bar .sq{width:8px;height:8px;background:var(--accent);flex:none}
  #mo .bar .t{white-space:nowrap}
  #mo .seg{margin-left:auto;display:flex;background:#fff;padding:2px}
  #mo .seg button{border:none;background:none;font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--faint);padding:6px 10px;cursor:pointer;transition:background .3s,color .3s;white-space:nowrap}
  #mo .seg button.on{background:var(--ink);color:#fff}
  #mo .seg button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  #mo .ib{width:30px;height:30px;flex:none;border:none;background:none;color:var(--faint);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s,color .2s}
  #mo .ib:hover{background:#fff;color:var(--ink)}
  #mo .ib svg{width:15px;height:15px}
  #mo .ib:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  #mo .body{padding:12px 14px 14px}

  /* ---------- the stage: eight sheets that become one map ---------- */
  #mo .stage{position:relative;height:var(--H,540px);background:#fff;overflow:hidden}
  #mo .ly{position:absolute;left:var(--cx,200px);top:calc(var(--cy,440px) - var(--i) * var(--g,46px));width:320px;height:200px;margin:-100px 0 0 -160px;
    transform:scale(var(--K,1)) rotateX(60deg) rotateZ(-45deg);
    background:rgba(255,255,255,.5);box-shadow:inset 0 0 0 1.5px var(--mc),-10px 10px 24px rgba(22,22,22,.07);
    transition:transform 1.15s var(--io),top .95s var(--io),left 1.15s var(--io),opacity .5s var(--ease),background .6s,box-shadow .6s;z-index:calc(var(--i) + 1)}
  #mo .ly>svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}
  #mo .ly.base{background:#F4F4F1}
  #mo .ly.off{opacity:0;top:calc(var(--cy,440px) - var(--i) * var(--g,46px) - 56px);pointer-events:none}
  #mo .ly.new{background:rgba(255,255,255,.78)}
  #mo .stage.dimmed .ly:not(.hl):not(.base){opacity:.22}
  #mo .stage.dimmed .ly.off{opacity:0}
  /* merged: gaps close, then the stack turns to face you */
  #mo .stage.merge .ly{top:var(--cy,440px)}
  #mo .stage.flat .ly{top:var(--fy,50%);left:50%;transform:scale(var(--S,1.6));background:transparent;box-shadow:none}
  #mo .stage.flat .ly.base{background:#F4F4F1}
  #mo .stage.flat .ly.off{opacity:0}
  /* callout tags beside each sheet */
  #mo .tag{position:absolute;left:var(--tx,400px);top:calc(var(--cy,440px) - var(--i) * var(--g,46px));transform:translateY(-50%);display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--ink);white-space:nowrap;transition:opacity .45s var(--ease),transform .5s var(--ease-out);z-index:20}
  #mo .tag::before{content:"";width:16px;height:2px;background:var(--mc)}
  #mo .tag i{width:8px;height:8px;background:var(--mc)}
  #mo .tag.off{opacity:0;transform:translateY(-50%) translateX(-8px)}
  #mo .stage.merge .tag{opacity:0}
  #mo .stage.flat .tag{left:var(--lx);top:var(--ly);opacity:1;transition:opacity .5s var(--ease) .9s,left 0s .8s,top 0s .8s}
  #mo .stage.flat .tag::before{display:none}
  #mo .stage.flat .tag{letter-spacing:.04em}
  #mo .stage.flat .tag.off{opacity:.3}
  #mo .stage.dimmed .tag:not(.hl){opacity:.25}
  #mo .stage.dimmed .tag.off{opacity:0}
  #mo .badge{position:absolute;left:14px;top:14px;display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--ink);color:#fff;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.1em;opacity:0;transform:translateY(-6px);transition:opacity .4s var(--ease),transform .5s var(--ease-out);z-index:30}
  #mo .badge i{width:6px;height:6px;background:#9CFF8F}
  #mo .stage.flat .badge{opacity:1;transform:none;transition-delay:.9s}
  #mo .stage.flat.dimmed .tag:not(.hl){opacity:.3}

  /* the one agent */
  #mo .agent{display:grid;grid-template-columns:40px minmax(0,1fr);gap:14px;align-items:center;height:72px;margin-top:2px;padding:0 16px;background:var(--purple-050)}
  #mo .agent .ai{width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:var(--purple);color:#fff}
  #mo .agent .ai svg{width:19px;height:19px}
  #mo .agent small{display:block;font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.1em;color:var(--purple)}
  #mo .agent b{display:block;margin-top:1px;font-size:15px;font-weight:600;letter-spacing:-.01em;line-height:1.3;color:var(--ink);transition:opacity .25s,transform .3s var(--ease-out)}
  #mo .agent.sw b{opacity:0;transform:translateY(5px)}

  /* the three ones */
  #mo .ones{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;margin-top:2px}
  #mo .one{padding:14px 16px 15px;background:#fff}
  #mo .one b{display:flex;align-items:baseline;gap:9px;font-size:30px;font-weight:600;letter-spacing:-.03em;line-height:1;color:var(--ink)}
  #mo .one b span{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--accent)}
  #mo .one small{display:block;margin-top:7px;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #mo .one small i{font-style:normal;font-weight:600;color:var(--ink);display:inline-block;transition:transform .35s var(--spring)}
  #mo .one small i.pop{transform:scale(1.35)}
  #mo .note{margin-top:14px;font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.12em;color:var(--gray-30)}

  #mo .reveal{opacity:0;transform:translateY(22px);transition:opacity .8s var(--ease-soft),transform .8s var(--ease-soft)}
  #mo .reveal.in{opacity:1;transform:none}
  #mo .reveal.d1{transition-delay:.1s}

  @media(max-width:980px){
    #mo .grid{grid-template-columns:minmax(0,1fr);row-gap:28px}
    #mo .vis{order:-1}
    #mo .list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:16px}
    #mo .hint{grid-column:1/-1}
  }
  @media(max-width:640px){
    #mo .list{grid-template-columns:minmax(0,1fr)}
    #mo .row{padding:10px 4px;gap:12px}
    #mo .hint{padding:0 4px}
    #mo .body{padding:8px 8px 10px}
    #mo .bar .t{display:none}
    #mo .seg{margin-left:0}
    #mo .ib{margin-left:auto}
    #mo .tag{font-size:9px;gap:5px;letter-spacing:.05em}
    #mo .tag::before{width:8px}
    #mo .tag i{width:6px;height:6px}
    #mo .badge{left:8px;top:8px;font-size:9.5px;padding:5px 8px}
    #mo .agent{height:84px;padding:0 12px;gap:12px}
    #mo .agent b{font-size:14px}
    #mo .one{padding:12px 10px}
    #mo .one b{font-size:24px;gap:6px}
    #mo .one b span{font-size:9.5px;letter-spacing:.08em}
    #mo .one small{font-size:11.5px}
    #mo .one small .lg{display:none}
  }
  @media(prefers-reduced-motion:reduce){
    #mo *{animation:none!important;transition:none!important}
    #mo .reveal{opacity:1;transform:none}
  }
</style>
</head>
<body>

<section id="mo" aria-labelledby="moTitle">
  <div class="wrap">
    <div class="sec-head reveal">
      <span class="eyebrow">One platform</span>
      <h2 id="moTitle">Every module.<br><span class="hl">One map, one agent, one record.</span></h2>
      <p>Turn on what your operation needs. Nothing to reconcile between tools.</p>
    </div>

    <div class="grid reveal d1">
      <div class="list" id="moList"></div>
      <div class="vis">
        <div class="frame" id="moFrame">
          <div class="scr">
            <div class="bar"><span class="sq"></span><span class="t">Syncnox</span>
              <div class="seg" role="tablist" aria-label="View"><button type="button" id="vLayers" class="on" role="tab">MODULES</button><button type="button" id="vMap" role="tab">ONE MAP</button></div>
              <button type="button" class="ib" id="moPlay" aria-label="Pause"></button></div>
            <div class="body">
              <div class="stage" id="moStage"><div class="badge" id="moBadgeBox"><i></i><span id="moBadge">ONE MAP · 8 MODULES</span></div></div>
              <div class="agent" id="moAgent" aria-live="polite"><span class="ai"></span><span><small>THE AGENT</small><b id="moSay"></b></span></div>
              <div class="ones">
                <div class="one"><b>1<span>MAP</span></b><small><i id="o0">1</i> <span id="o0t">layer</span><span class="lg"> on it</span></small></div>
                <div class="one"><b>1<span>AGENT</span></b><small><i id="o1">1</i> <span id="o1t">module</span><span class="lg"> feeding it</span></small></div>
                <div class="one"><b>1<span>RECORD</span></b><small><i>0</i> exports<span class="lg"> to reconcile</span></small></div>
              </div>
            </div>
          </div>
        </div>
        <div class="note">SAMPLE MAP · ILLUSTRATIVE DATA</div>
      </div>
    </div>
  </div>
</section>

    {t:'AI route optimization',d:'Always-on planning and re-planning — the core of Syncnox.',ic:'route',c:'#015c11',core:1,tag:'ROUTES',say:'Plans and re-plans every route, all day.'},
    {t:'Field service management',d:'Scheduling, dispatch and job updates for every crew.',ic:'hard-hat',c:'#007d79',tag:'JOBS & CREWS',say:'Gives every job to a crew with the right skills.'},

    {t:'Asset & equipment tracking',d:'Powered and non-powered equipment on the same map.',ic:'forklift',c:'#161616',tag:'EQUIPMENT',say:'Plans around the equipment that is actually on site.'},
    {t:'Maintenance & inspections',d:'Usage-based service, fault code alerts and digital inspections.',ic:'wrench',c:'#c65300',tag:'SERVICE',say:'Never routes a vehicle that is due in the shop.'},
    {t:'Fuel, idle & PTO',d:'Engine time, idle alerts and off-road fuel reporting.',ic:'fuel',c:'#b28600',tag:'FUEL & IDLE',say:'Ties engine and idle time to the job that used it.'},
    {t:'Geofencing & security',d:'Site perimeters, after-hours alerts and theft recovery.',ic:'shield-check',c:'#da1e28',tag:'GEOFENCES',say:'Confirms arrivals and raises after-hours alerts.'},
    {t:'Your existing telematics',d:'Already have devices? Connect them instead of replacing them.',ic:'plug',c:'#525252',api:1,tag:'YOUR DEVICES',say:'Reads positions from the devices you already own.'}
  ];
  var list=$('moList'), stage=$('moStage');
  list.innerHTML='<div class="hint"><span>MODULES</span><span>TURN ON WHAT YOU NEED</span></div>';
  var rows=M.map(function(m,i){ var b=document.createElement('button'); b.type='button'; b.className='row'+(m.core?' core on':''); b.style.setProperty('--mc',m.c); b.setAttribute('role','switch'); b.setAttribute('aria-checked',m.core?'true':'false');
    b.innerHTML='<span class="pi">'+ic(m.ic)+'</span><span><b>'+esc(m.t)+(m.core?'<em>CORE</em>':'')+(m.api?'<em class="api">VIA API</em>':'')+'</b><small>'+m.d+'</small></span><span class="sw"></span>';
    if(!m.core) b.addEventListener('click',function(){ stopAuto(); if(view!=='iso') setView('iso'); set(i,!on[i]); });
    b.addEventListener('mouseenter',function(){ hl(i); }); b.addEventListener('mouseleave',function(){ hl(-1); });
    b.addEventListener('focus',function(){ hl(i); }); b.addEventListener('blur',function(){ hl(-1); });
    list.appendChild(b); return b; });

  /* ================= sheets ================= */
  var RD=['M150 100 L150 60 L90 60 L90 30 L45 30','M150 100 L210 100 L210 60 L270 60 L270 30','M150 100 L150 150 L230 150 L230 172 L290 172'];
  var DART='M10 0 L-7 -7.5 L-3 0 L-7 7.5 Z';
  function P(d,w,c,g,extra){ var a={d:d,fill:'none',stroke:c,'stroke-width':w,'stroke-linecap':'square','stroke-linejoin':'round'}; for(var k in extra||{}) a[k]=extra[k]; return el('path',a,g); }
  function glyph(g,x,y,name,c,outline){ var q=el('g',{transform:'translate('+x+' '+y+')'},g); el('rect',{x:-9,y:-9,width:18,height:18,fill:outline?'#fff':c,stroke:outline?c:'#fff','stroke-width':outline?2:1.5},q);
    var s=el('svg',{x:-6,y:-6,width:12,height:12,viewBox:'0 0 24 24',fill:'none',stroke:outline?c:'#fff','stroke-width':2,'stroke-linecap':'round','stroke-linejoin':'round'},q); s.innerHTML=I[name]; return q; }
  var ly=[], tags=[], paths=[], darts=[];
  M.forEach(function(m,i){
    var d=document.createElement('div'); d.className='ly'+(i===0?' base':' off'); d.style.setProperty('--i',i); d.style.setProperty('--mc',m.c);
    var s=el('svg',{viewBox:'0 0 320 200','aria-hidden':'true'}); d.appendChild(s); stage.appendChild(d); ly.push(d);
    var t=document.createElement('div'); t.className='tag'+(i===0?'':' off'); t.style.setProperty('--i',i); t.style.setProperty('--mc',m.c); t.innerHTML='<i></i>'+esc(m.tag); stage.appendChild(t); tags.push(t);
    if(i===0){ /* base map + routes */
      ['M30 0V200','M90 0V200','M210 0V200','M270 0V200','M0 30H320','M0 60H320','M0 150H320','M0 172H320'].forEach(function(x){ P(x,1.5,'#fff',s); });
      P('M0 100H320',5,'#fff',s); P('M150 0V200',4,'#fff',s);
      el('rect',{x:26,y:112,width:76,height:60,fill:'#EAEAE6'},s);
      RD.forEach(function(x){ P(x,5.5,'#fff',s); P(x,2.6,'#015c11',s); paths.push(el('path',{d:x,fill:'none',stroke:'none'},s)); });
      el('rect',{x:143,y:93,width:14,height:14,fill:'#161616',stroke:'#fff','stroke-width':1.5},s); el('rect',{x:148,y:98,width:4,height:4,fill:'#9CFF8F'},s);
    }
    if(i===1){ paths.forEach(function(p,r){ var n=p.getTotalLength(); [.3,.52,.76,1].forEach(function(f,k){ if(r===2&&k===0) return; var pt=p.getPointAtLength(f*n); el('rect',{x:pt.x-5,y:pt.y-5,width:10,height:10,fill:k%2?'#fff':'#007d79',stroke:'#007d79','stroke-width':2},s); }); }); }
    if(i===2){ [0,1,2].forEach(function(r){ var g=el('g',{},s); el('path',{d:DART,fill:'#0f62fe',stroke:'#fff','stroke-width':2,'stroke-linejoin':'round','paint-order':'stroke'},g); darts.push({p:r,k:[.42,.62,.3][r],d:1,g:g}); }); }
    if(i===3){ glyph(s,46,130,'tractor','#161616'); glyph(s,64,152,'caravan','#161616',1); glyph(s,82,130,'zap','#161616'); }
    if(i===4){ glyph(s,170,116,'wrench','#c65300'); }
    if(i===5){ glyph(s,90,60,'timer','#b28600'); }
    if(i===6){ el('rect',{x:20,y:106,width:88,height:72,fill:'rgba(218,30,40,.06)',stroke:'#da1e28','stroke-width':2,'stroke-dasharray':'5 4'},s); }
    if(i===7){ var g2=el('g',{},s); el('path',{d:DART,fill:'#fff',stroke:'#525252','stroke-width':2.2,'stroke-linejoin':'round'},g2); darts.push({p:2,k:.86,d:-1,g:g2}); }
  });

  /* ================= state ================= */
  var on=M.map(function(m){ return !!m.core; }), latest=0, sayT=null, view='iso', newT=null;
  function bump(id,v){ var e=$(id); if(e.textContent!==String(v)){ e.textContent=v; e.classList.add('pop'); setTimeout(function(){ e.classList.remove('pop'); },260); } }
  function say(txt){ var a=$('moAgent'); clearTimeout(sayT); a.classList.add('sw'); sayT=setTimeout(function(){ $('moSay').textContent=txt; a.classList.remove('sw'); },reduce?0:200); }
  function count(){ return on.filter(Boolean).length; }
  function refresh(){ var n=count(); bump('o0',n); bump('o1',n); $('o0t').textContent='layer'+(n===1?'':'s'); $('o1t').textContent='module'+(n===1?'':'s'); $('moBadge').textContent='ONE MAP · '+n+' MODULE'+(n===1?'':'S'); }
  function set(i,v){
    if(M[i].core||on[i]===v) return; on[i]=v;
    rows[i].classList.toggle('on',v); rows[i].setAttribute('aria-checked',v?'true':'false');
    ly[i].classList.toggle('off',!v); tags[i].classList.toggle('off',!v); refresh();
    if(v){ latest=i; clearTimeout(newT); ly.forEach(function(l){ l.classList.remove('new'); }); ly[i].classList.add('new'); newT=setTimeout(function(){ ly[i].classList.remove('new'); },1400); if(view==='iso') say(M[i].say); }
    else if(latest===i){ latest=0; for(var k=M.length-1;k>0;k--){ if(on[k]){ latest=k; break; } } if(view==='iso') say(M[latest].say); }
  }
  function hl(i){ var a=i>=0&&on[i]; stage.classList.toggle('dimmed',!!a&&i>0); ly.forEach(function(l,k){ l.classList.toggle('hl',a&&k===i); }); tags.forEach(function(t,k){ t.classList.toggle('hl',a&&k===i); }); rows.forEach(function(r,k){ r.classList.toggle('hl',k===i); }); if(a&&view==='iso') say(M[i].say); }
  var vT=null;
  function setView(v){
    view=v; clearTimeout(vT); $('vLayers').classList.toggle('on',v==='iso'); $('vMap').classList.toggle('on',v==='flat');
    if(v==='flat'){ stage.classList.add('merge'); vT=setTimeout(function(){ stage.classList.add('flat'); },reduce?0:820); var n=count(); say(n===1?'Plans and re-plans every route, all day.':'Plans from all '+n+' modules at once. Nothing to reconcile.'); }
    else { stage.classList.remove('flat'); vT=setTimeout(function(){ stage.classList.remove('merge'); },reduce?0:1000); say(M[latest].say); }
  }
  $('vLayers').addEventListener('click',function(){ stopAuto(); setView('iso'); setPlayIcon(); });
  $('vMap').addEventListener('click',function(){ stopAuto(); setView('flat'); setPlayIcon(); });

  /* geometry: scale the stack to the stage */
  function fit(){
    var W=stage.clientWidth, small=W<420, tagW=small?92:150, K=Math.min(1,(W-tagW-24)/368), g=small?30:42, pad=small?12:18;
    var H=Math.round(184*K+7*g+pad*2), cx=Math.round(184*K+pad), cy=Math.round(H-pad-92*K), cols=small?2:4, lh=small?20:26, legH=Math.ceil(8/cols)*lh, S=Math.min((W-pad*2)/320,(H-pad*2-legH-16)/200);
    var mapH=200*S, top0=Math.round((H-(mapH+16+legH))/2), mapL=(W-320*S)/2, colW=320*S/cols;
    stage.style.setProperty('--fy',Math.round(top0+mapH/2)+'px');
    tags.forEach(function(t,k){ t.style.setProperty('--lx',Math.round(mapL+(k%cols)*colW)+'px'); t.style.setProperty('--ly',Math.round(top0+mapH+16+lh/2+Math.floor(k/cols)*lh)+'px'); });
    var bb=$('moBadgeBox'); if(top0>=46){ bb.style.top=(top0-38)+'px'; bb.style.left=Math.round(mapL)+'px'; } else { bb.style.top=(top0+8)+'px'; bb.style.left=Math.round(mapL+8)+'px'; }
    stage.style.setProperty('--K',K.toFixed(3)); stage.style.setProperty('--g',g+'px'); stage.style.setProperty('--H',H+'px'); stage.style.setProperty('--cx',cx+'px'); stage.style.setProperty('--cy',cy+'px');
    stage.style.setProperty('--tx',Math.round(cx+184*K+6)+'px'); stage.style.setProperty('--S',S.toFixed(3));
  }
  fit(); window.addEventListener('resize',fit);

  /* vehicles drive out and back along their routes */
  var last=performance.now(), rafOn=false;
  function loop(now){
    var dt=Math.min(64,now-last)/1000; last=now;
    darts.forEach(function(v){ if(!paused){ v.k+=v.d*dt*.03; if(v.k>=1){ v.k=1; v.d=-1; } if(v.k<=.08){ v.k=.08; v.d=1; } }
      var p=paths[v.p], n=p.getTotalLength(), a=p.getPointAtLength(v.k*n), b=p.getPointAtLength(Math.min(n,v.k*n+2)), c=p.getPointAtLength(Math.max(0,v.k*n-2));
      v.g.setAttribute('transform','translate('+a.x.toFixed(1)+' '+a.y.toFixed(1)+') rotate('+(Math.atan2(b.y-c.y,b.x-c.x)*180/Math.PI+(v.d<0?180:0)).toFixed(0)+')'); });
    if(rafOn) requestAnimationFrame(loop);
  }
  function startLoop(){ if(!rafOn){ rafOn=true; last=performance.now(); requestAnimationFrame(loop); } }
  function stopLoop(){ rafOn=false; }

  /* ================= autoplay: sheets drop in, merge into one map, come apart, repeat ================= */
  var playing=!reduce, inView=false, hover=false, paused=false, step=1, phase=0, tick=null;
  function advancing(){ return playing&&!paused&&inView&&!hover; }
  function next(){
    clearTimeout(tick); tick=null; if(!advancing()) return;
    if(phase===0){ if(step<M.length){ set(step,true); step++; tick=setTimeout(next,step<M.length?1700:2300); } else { phase=1; next(); } }
    else if(phase===1){ setView('flat'); phase=2; tick=setTimeout(next,6800); }
    else { setView('iso'); for(var k=M.length-1;k>0;k--) (function(k,n){ setTimeout(function(){ if(playing) set(k,false); },1100+n*120); })(k,M.length-1-k); step=1; phase=0; tick=setTimeout(next,3600); }
  }
  function sync(){ clearTimeout(tick); tick=null; if(advancing()) tick=setTimeout(next,1000); }
  function stopAuto(){ playing=false; clearTimeout(tick); }
  function setPlayIcon(){ var b=$('moPlay'), stopped=paused||!playing; b.innerHTML=ic(stopped?'play':'pause'); b.setAttribute('aria-label',stopped?'Play':'Pause'); }
  $('moPlay').addEventListener('click',function(){ if(!playing){ playing=!reduce; paused=false; step=1; phase=0; setView('iso'); for(var k=1;k<M.length;k++) set(k,false); } else paused=!paused; setPlayIcon(); sync(); });
  list.addEventListener('click',setPlayIcon);
  var frame=$('moFrame');
  frame.addEventListener('mouseenter',function(){ hover=true; sync(); });
  frame.addEventListener('mouseleave',function(){ hover=false; sync(); });
  frame.addEventListener('pointermove',function(e){ var r=frame.getBoundingClientRect(); frame.style.setProperty('--mx',((e.clientX-r.left)/r.width*100)+'%'); frame.style.setProperty('--my',((e.clientY-r.top)/r.height*100)+'%'); });

  /* first paint */
  root.querySelector('.agent .ai').innerHTML=ic('sparkles'); $('moSay').textContent=M[0].say; setPlayIcon(); refresh(); loop(performance.now());
  if(reduce){ for(var k=1;k<M.length;k++) set(k,true); }
  var reveals=root.querySelectorAll('.reveal');
  if('IntersectionObserver' in window && !reduce){
    var ro=new IntersectionObserver(function(es){ es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('in'); ro.unobserve(e.target);} }); },{threshold:.1});
    reveals.forEach(function(x){ro.observe(x);});
    var vo=new IntersectionObserver(function(es){ inView=es[0].isIntersecting; if(inView){ startLoop(); sync(); } else { sync(); stopLoop(); } },{threshold:.3});
    vo.observe(frame);
  } else { reveals.forEach(function(x){x.classList.add('in');}); inView=true; startLoop(); }
})();
</script>

<script>
/* iframe helper: report real height to the parent page */
(function(){
  if(window.parent===window)return;
  var last=0;
  function send(){
    var h=Math.ceil(document.documentElement.getBoundingClientRect().height);
    if(h&&h!==last){last=h;window.parent.postMessage({syncnoxFrame:'modules',height:h},'*');}
  }
  if('ResizeObserver' in window){new ResizeObserver(send).observe(document.documentElement);}
  window.addEventListener('load',send);
  window.addEventListener('resize',send);
  send();
})();
</script>
